.reveal figure.quarto-float > figcaption{display:none}

.reveal .slide-number{width:auto!important;left:65px!important;right:auto!important;pointer-events:none}

/* The entries below are copies of Quarto/citeproc's bibliography output. */
.reveal .slide aside.slide-citations {
  position:absolute;left:0;right:0;bottom:2px;
  font-size:14px;line-height:1.3;color:var(--muted);
  border-top:1px solid var(--rule);padding-top:6px;
}
.reveal .slide-citations .csl-entry { margin:0 0 4px;display:flex;gap:8px; }
.reveal .slide-citations .csl-entry:last-child { margin-bottom:0; }
.reveal .slide-citations .csl-left-margin { flex:0 0 auto; }
.reveal .slide-citations .csl-right-inline { margin:0;overflow-wrap:anywhere; }
.reveal #refs { font-size:23px;line-height:1.5; }
.reveal #refs .csl-entry { margin-bottom:22px; }
.reveal #refs .csl-right-inline { overflow-wrap:anywhere; }

.reveal figure figcaption{display:none}
.print-scenes figure:only-child{width:100%}
.print-scenes figure:only-child img{max-height:390px;width:100%}

.reveal section.cover h2{display:none}
.print-scenes figure{flex:1;width:0}

/* 用語の小さな注釈（ページ下部） */
.reveal .footnote-small{position:absolute;left:0;right:0;bottom:12px;font-size:17px;line-height:1.4;color:var(--muted)}
.reveal .footnote-small p{margin:0}
.reveal .figure-compact .animation{height:400px}
.reveal .figure-tall .animation{height:490px}

/* 数式（html-math-method: plain） */
.reveal .math{font-family:"Times New Roman",Times,serif;font-size:1.08em}
.reveal .math sub,.reveal .math sup{font-size:.68em}

/* 白地に青の見出し帯と、全ページ共通のフッター罫線。 */
.reveal .slides section.slide::after{
  content:"";position:absolute;left:0;right:0;bottom:-4px;
  border-top:2px solid var(--rule);pointer-events:none;
}
.reveal .cover-title{color:var(--header)}
.reveal .cover .kicker{border-top:6px solid var(--header);padding-top:18px}
.reveal table th{color:var(--header);background:#edf5fc}
.reveal .slide-number{color:var(--header)}
.reveal .slide-number a{color:inherit}
@media print{
  .reveal h2,.reveal .cover .kicker,.reveal table th{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
}
.print-pdf .reveal .slides section.slide::after{bottom:60px}
@media print{.reveal .slides section.slide::after{bottom:60px}}

/* 引用フッターがあるページでは、用語の注釈を本文の流れに置いて重なりを避ける。 */
.reveal .has-citations .footnote-small{position:static;margin-top:10px}
/* 左に図、右に利点・欠点を置く2段組。 */
.reveal .method-slide .columns{gap:24px;align-items:flex-start}
.reveal .method-slide .column p{margin:6px 0 2px}
.reveal .method-slide .column ul{font-size:.82em;line-height:1.55;margin-top:4px}
.reveal .method-slide .column li{margin-bottom:6px}
.reveal .method-slide .animation{height:430px}
/* 図の下にも本文があり、引用フッターも入るページ。 */
.reveal .figure-short .animation{height:330px}
/* 列の多い表。 */
.reveal .dense-table table{font-size:.6em}
.reveal .dense-table table td,.reveal .dense-table table th{padding:9px 10px}
/* 文献一覧は2段で1ページに収める。 */
.reveal #refs{font-size:18px;line-height:1.45;column-count:2;column-gap:36px}
.reveal #refs .csl-entry{margin-bottom:14px;break-inside:avoid}
.reveal .figure-medium .animation{height:360px}
/* 引用と注釈が下に入る表。 */
.reveal .compact-table table td,.reveal .compact-table table th{padding:9px 20px}

/* 本文の左右に1文字分の余白を確保し、見出し帯は元の幅を保つ。 */
.reveal .slides section.slide{
  --content-inset:29px;
  box-sizing:border-box;
  padding-inline:var(--content-inset);
}
.reveal .slides section.slide > h2{
  margin-inline:calc(-1 * var(--content-inset));
  padding-left:calc(20px + .5em);
}
.reveal .slide aside.slide-citations,
.reveal .slide .footnote-small{
  left:var(--content-inset);right:var(--content-inset);
}
/* 余白追加による本文の折り返し後も、図をフッターより上に収める。 */
.reveal #future-parallel-lmask .animation{height:420px}
/* 会議名を含む2行の引用フッターとの間隔を確保する。 */
.reveal #model-overview .animation{height:430px}

/* 実験結果：左右の曲線と軸ラベルを投影サイズで保つ。 */
.reveal .result-slide .animation{height:480px}
.reveal .assignment-slide .animation{height:490px}
.reveal .assignment-slide > p{font-size:26px;line-height:1.5}

/* 標準のメニューボタンもスライド上には置かない。 */
.slide-menu-button{display:none!important}

/* メッセージと図内文字を、余白のあるモデル説明ページで大きく表示。 */
.reveal #am-encoder .animation{height:530px}
.reveal #am-decoder .animation,
.reveal #model-encoder-input .animation,
.reveal #model-encoder-profile .animation{height:510px}
/* 本文が1行のエンコーダー層のページは、フッター罫線の上まで図を広げる。 */
.reveal #model-encoder-self .animation,
.reveal #model-encoder-cross .animation{height:555px}

.reveal #why-parallel .animation{height:400px}

/* Small, non-interactive keyboard reference beside the page-number footer. */
.reveal .slide-shortcuts{
  position:absolute;right:24px;bottom:16px;z-index:20;
  display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 16px;
  max-width:calc(100% - 150px);font-size:12px;line-height:1.5;
  color:var(--muted);pointer-events:none;
}
.reveal .slide-shortcuts span{white-space:nowrap}
.reveal.overview .slide-shortcuts,.print-pdf .slide-shortcuts{display:none}
@media print{.reveal .slide-shortcuts{display:none}}

/* Esc overview: fill the viewport with selectable thumbnails in reading order. */
@media screen{
  .reveal.overview .slides{
    display:grid!important;
    grid-template-columns:repeat(var(--overview-columns),minmax(0,1fr));
    gap:24px;align-content:start;
    position:absolute;inset:0!important;
    width:100%!important;height:100%!important;
    padding:32px;box-sizing:border-box;margin:0!important;
    transform:none!important;zoom:1!important;
    overflow:auto!important;scrollbar-gutter:stable;
  }
  .reveal.overview .slides section.slide{
    display:block!important;position:relative!important;
    top:0!important;left:0!important;margin:0!important;
    width:var(--overview-width)!important;height:var(--overview-height)!important;
    min-height:0!important;transform:none!important;
    zoom:var(--overview-scale);opacity:1!important;visibility:visible!important;
    background:var(--paper);outline:5px solid #c3cfda;outline-offset:0;
    cursor:pointer;overflow:hidden;
  }
  .reveal.overview .slides section.slide.present,
  .reveal.overview .slides section.slide:hover{outline-color:var(--accent)}
  .reveal.overview .slides section.slide *{pointer-events:none!important}
  .reveal.overview .backgrounds,.reveal.overview .slide-number,
  .reveal.overview .progress{display:none!important}
}

let index=0, step=0, held=null, timer=null, long=false, lastInput=-Infinity;
const frames=s=>[...s.querySelectorAll('iframe')];
function maxStep(){return Math.max(0,...frames(slides[index]).map(f=>f.contentWindow.animation?.steps||0),...[...slides[index].querySelectorAll('[data-step],[data-highlight-step]')].map(e=>Number(e.dataset.step||e.dataset.highlightStep)));}
function paint(animate=false){slides.forEach((s,i)=>{s.classList.toggle('active',i===index);s.setAttribute('aria-hidden',String(i!==index));frames(s).forEach(f=>f.contentWindow.animation?.setVisible?.(i===index));}); frames(slides[index]).forEach(f=>f.contentWindow.animation?.setStep(step,animate));slides[index].querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('pending',Number(e.dataset.step)>step)); slides[index].querySelectorAll('[data-highlight-step]').forEach(e=>{e.classList.toggle('animate-highlight',animate);e.classList.toggle('is-highlighted',Number(e.dataset.highlightStep)<=step);}); history.replaceState(null,'',`#${index+1}/${step}`);}
function go(i,n=0,animate=false){index=Math.max(0,Math.min(slides.length-1,i));step=Math.max(0,Math.min(maxStep(),n));paint(animate);}
function move(dir){const now=performance.now(),animate=now-lastInput>300;lastInput=now;if(dir>0){step<maxStep()?go(index,step+1,animate):go(index+1);}else{step>0?go(index,step-1,animate):(index>0&&go(index-1,Infinity));}}
function jump(dir){go(index,dir>0?Infinity:0);}
function resize(){let scale=Math.min(innerWidth/1280,innerHeight/720)*.95;stage.style.transform=`scale(${scale})`;stage.style.left=`${(innerWidth-1280*scale)/2}px`;stage.style.top=`${(innerHeight-720*scale)/2}px`;}
function close(){overview.hidden=true;document.querySelector('#menu').focus();}
function menu(){overview.hidden=false;overview.querySelectorAll('.thumb').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));overview.querySelector('#close').focus();}
const grouped=slides.some(s=>s.dataset.sectionStart==='true');
let row;
slides.forEach((s,i)=>{if(!row||s.dataset.sectionStart==='true'){if(grouped){const h=document.createElement('h2');h.textContent=s.dataset.group||'表紙';overview.append(h);}row=document.createElement('div');row.className=grouped?'overview-row':'overview-grid';overview.append(row);}const b=document.createElement('button');b.className='thumb';const num=document.createElement('span');num.textContent=String(i+1).padStart(2,'0');b.append(num,document.createTextNode(s.querySelector('h1,h2')?.textContent||'Slide'));b.onclick=()=>{go(i);close();};row.append(b);});
document.querySelector('#menu').onclick=menu;document.querySelector('#close').onclick=close;
async function fullscreen(){try {if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.querySelector('#fullscreen').textContent='全画面非対応';}catch{document.querySelector('#fullscreen').textContent='全画面非対応';}}
document.querySelector('#fullscreen').onclick=fullscreen;
function cancel(){clearTimeout(timer);held=null;long=false;}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(!overview.hidden){if(e.key==='Escape')close();if(e.key==='Tab'){const items=[...overview.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus();}}return;}if(e.target.closest('button,a')&&(e.key===' '||e.key==='Enter'))return;
if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(held)return;held=e.key;long=false;timer=setTimeout(()=>{long=true;jump(e.key==='ArrowRight'?1:-1);},450);return;}
if(e.repeat)return;if(['ArrowDown','ArrowUp',' ','Escape','o','f'].includes(e.key))e.preventDefault();if(e.key==='ArrowDown')go(index+1);if(e.key==='ArrowUp')go(index-1);if(e.key===' ')move(1);if(e.key==='Escape'||e.key==='o')menu();if(e.key==='f')fullscreen();});
addEventListener('keyup',e=>{if(e.key===held){if(!long)move(e.key==='ArrowRight'?1:-1);cancel();}});addEventListener('blur',cancel);document.addEventListener('visibilitychange',cancel);
stage.addEventListener('click',e=>{if(e.target.closest('a,button,input')||!overview.hidden)return;const r=stage.getBoundingClientRect();move(e.clientX-r.left<r.width*.3?-1:1);});
window.deck={go,move,jump,maxStep,get index(){return index},get step(){return step},get count(){return slides.length}};
addEventListener('resize',resize);resize();
Promise.all([...document.querySelectorAll('iframe')].map(f=>new Promise(resolve=>{if(f.contentWindow?.animation)resolve();else f.addEventListener('load',resolve,{once:true});}))).then(()=>{const m=location.hash.match(/^#(\d+)(?:\/(\d+))?$/);go(m?Number(m[1])-1:0,m?Number(m[2]||0):0);window.deckReady=true;});
})();
</script></body></html>
